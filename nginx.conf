# =========================
# FRONT - rdmhml.saude.sp.gov.br
# =========================

# Redireciona HTTP para HTTPS
server {
    listen 80;
    server_name rdmhml.saude.sp.gov.br;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name rdmhml.saude.sp.gov.br;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certificado/certificado.crt;
    ssl_certificate_key /etc/nginx/certificado/saude.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =========================
# API - apirdmhml.saude.sp.gov.br (proxy para 8080)
# =========================

# Redireciona HTTP para HTTPS
server {
    listen 443 ssl;
    server_name apirdmhml.saude.sp.gov.br;

    ssl_certificate     /etc/nginx/certificado/certificado.crt;
    ssl_certificate_key /etc/nginx/certificado/saude.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # se bater na raiz, manda direto pro swagger
    location = / {
        return 302 /swagger/;
    }

    location / {
        proxy_pass http://192.168.1.60:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # se o backend responder com redirect pro IP:8080, isso corrige
        proxy_redirect http://192.168.1.60:8080/ /;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
