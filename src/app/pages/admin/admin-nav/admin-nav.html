<!-- src/app/pages/admin/admin-nav/admin-nav.html -->
<nav class="admin-sidebar sidebar" aria-label="Navegação do administrador">
  <div class="sidebar-header">
    <h2 class="sidebar-title">Painel Admin</h2>
    <div class="admin-badge">
      <mat-icon class="badge-icon">admin_panel_settings</mat-icon>
      <span class="badge-text">Administrador</span>
    </div>
  </div>

  <ul class="sidebar-nav" role="menubar">
    @for (tab of tabs; track tab.id) {
    <li role="none">
      <a [routerLink]="tab.route" class="sidebar-link" [class.active]="isActive(tab.route)" role="menuitem"
        [attr.aria-label]="tab.label" (click)="onTabClick(tab)" (keydown)="onKeyDown($event, tab.route)" tabindex="0">
        <span class="link-icon">
          <mat-icon>{{ tab.icon }}</mat-icon>
        </span>
        <span class="link-text">{{ tab.label }}</span>
        <span class="tooltip">{{ tab.label }}</span>
        @if (isActive(tab.route)) {
        <span class="active-indicator"></span>
        }
      </a>
    </li>
    }
  </ul>

  <div class="sidebar-footer">
    <button class="sidebar-link logout-btn" (click)="navigateToDashboard()" title="Solicitar mudança">
      <span class="link-icon">
        <mat-icon>space_dashboard</mat-icon>
      </span>
      <span class="link-text">Solicitar mudança</span>
      <span class="tooltip">Solicitar mudança</span>
    </button>
    <div class="version-info">
      <small>Versão {{ version }}</small>
    </div>
  </div>
</nav>
